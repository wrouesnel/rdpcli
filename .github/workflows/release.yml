name: Release

# Pushing a tag like v1.2.3 tests the tagged commit, builds the archives
# for every platform and publishes them as a GitHub release with
# generated notes. A tag with a hyphen (v1.2.3-rc.1) makes a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ $GITHUB_REF_NAME == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --generate-notes --title "rdpcli $GITHUB_REF_NAME" "${flags[@]}"
